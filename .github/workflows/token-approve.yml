name: token-approve
on: [pull_request]
jobs:
  approve:
    runs-on: ubuntu-latest
    permissions: {pull-requests: write}
    steps:
      - run: gh pr review "$PR" --approve -b "GITHUB_TOKEN approval attempt" -R "$GITHUB_REPOSITORY"
        env: {GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}"}
